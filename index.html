<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1,
 maximum-scale=1,user-scalable=no,
 viewport-fit=cover">

<title>ZEN</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  background:#171613;
  touch-action:none;
}

body{
  position:fixed;
  inset:0;
}

#garden{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  touch-action:none;
}

#hint{
  position:fixed;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  z-index:10;

  color:rgba(255,248,235,0);
  font:9px "IBM Plex Mono",
       "SFMono-Regular",monospace;
  letter-spacing:3px;

  pointer-events:none;
  transition:color .9s ease;
}

#hint.show{
  color:rgba(255,248,235,.45);
}
</style>
</head>

<body>

<canvas id="garden"></canvas>
<div id="hint">TOUCH THE SAND</div>

<script>
/* =========================================================
   ZEN GARDEN
   ---------------------------------------------------------
   Sand is a HEIGHT FIELD. Tools overwrite height; colour is
   derived from slope under a light that follows the sun.

   Every run is different: stone groups, stone shapes and
   stone families, and the falling petals/leaves are all
   generated fresh on load.

   Time of day and weather moods (from the ASCII ocean
   file) cycle on their own: night > dawn > day > dusk, and
   CALM / BREEZE / DRIZZLE / STORM.

   The rake is a real object that stays on the sand and never
   has to work under your fingertip:
     two fingers - place it BETWEEN them, as long as the gap
                   you hold (this sets its length)
     one finger  - touch anywhere; the handle locks to exactly
                   that distance and direction, and the rake
                   follows your finger from there
========================================================= */

const canvas=document.getElementById("garden");
const ctx=canvas.getContext("2d",{alpha:false});

const sand=document.createElement("canvas");
const sctx=sand.getContext("2d",{alpha:false});

const hint=document.getElementById("hint");

/* Logical garden size. The SHORT side is always 600 units. */
let W=0,H=0,DPR=1,K=1,UPP=1;   // UPP = logical units per css pixel

/* =========================================================
   CONFIG  (every tuned value lives here)
========================================================= */

const CFG={
  daySeconds:9000,      // one full night > dawn > day > dusk loop
  weatherMin:25,       // seconds a mood lasts (min)
  weatherMax:50,       // seconds a mood lasts (max)
  forceTime:null,      // freeze time: 0..1 or "night"|"dawn"|"day"|"dusk"
  forceWeather:null,   // lock mood: "CALM"|"BREEZE"|"DRIZZLE"|"STORM"
  rainPits:.45,        // how deeply rain dimples bare sand (0 = never)
  lightning:true,

  headOffsetPx:80,     // very first touch only: where the rake starts, above your finger (css px)
  maxHandlePx:760,     // longest handle; grabbing from farther pulls the rake in to this (css px)
  steerPx:16,          // how fast the rake turns to follow your stroke (css px; ~1000 = never turns)
  fingerGapPx:64,      // two fingers: clear space kept under each fingertip (css px)
  minTines:4,          // shortest rake head
  maxTines:61,         // longest rake head

  petalLandChance:.0008, // per-frame chance a falling petal settles
  petalRestMin:240,     // seconds a settled petal rests (min)
  petalRestMax:435      // seconds a settled petal rests (max)
};

const SAND=[201,186,165];

const LOOK={
  light:.075,   // slope lighting strength
  ao:.014,      // grooves darker / ridges lighter
  grain:.02     // static sand grain
};

/*
  The rake. With two fingers `tines` follows the gap between
  them (and sticks when you go back to one finger).
  w = groove width, depth = groove depth.
*/
const RAKE={tines:5,spacing:8,w:2.4,depth:4,turn:12};

const STEP=1.5;     // path resampling distance (units)
const FOLLOW=.6;    // pointer position smoothing
const DEAD=6;       // travel before a rake stroke commits


/* =========================================================
   TIME OF DAY
   Phase 0 night, .25 dawn, .50 day, .50 dusk (same order as
   the ocean file). Colours are tuned for sand, not copied
   from the ocean palette.
========================================================= */

const KEYS=[
  { // night
    grade:[162,124,173],  glow:[169,124,255],  glowAmt:.5,
    rain:[150,180,230],
    tx:-.45,ty:-.9,  lit:.3, shLen:.5,  shAmt:.35
  },
  { // dawn
    grade:[246,206,204],glow:[255,170,140],glowAmt:.26,
    rain:[210,220,235],
    tx:-.96,ty:-.28, lit:1.5, shLen:1,   shAmt:.9
  },
  { // day
    grade:[255,252,244],glow:[255,244,214],glowAmt:.05,
    rain:[225,235,245],
    tx:-.25,ty:-.97, lit:.95, shLen:.35, shAmt:.75
  },
  { // dusk
    grade:[250,178,148],glow:[115,83,86], glowAmt:.30,
    rain:[200,200,225],
    tx:.96,ty:-.28,  lit:1.5, shLen:1,   shAmt:.95
  }
];

const PHASE_NAMES={night:0,dawn:.25,day:.5,dusk:.75};


/* =========================================================
   WEATHER MOODS
========================================================= */

const MOODS={
  CALM:   {turb:.03,wind:.02,rain:0,  over:0},
  BREEZE: {turb:.10,wind:.45,rain:0,  over:.12},
  DRIZZLE:{turb:.18,wind:.30,rain:.30,over:.6},
  STORM:  {turb:.65,wind:1.80,rain:.80,over:.9}
};

/* Gentle moods are more common than storms. */
const MOOD_WEIGHTS={CALM:3,BREEZE:2,DRIZZLE:2,STORM:1};

function startPhase(){

  const f=CFG.forceTime;

  if(typeof f==="number")return f%1;
  if(typeof f==="string"&&f in PHASE_NAMES)return PHASE_NAMES[f];

  return Math.random();
}

const ENV={
  phase:startPhase(),
  t:0,

  turb:.03,wind:.02,rain:0,over:0,wet:0,

  mood:MOODS[CFG.forceWeather]||MOODS.CALM,
  label:CFG.forceWeather||"CALM",
  dir:1,
  timer:22000,

  grade:[255,255,255],
  glow:[255,255,255],
  glowAmt:0,
  rainCol:[225,235,245],
  hi:[250,245,235],

  flash:0,
  reflashed:false
};

/* Light state shared by sand shading and stones. */
const LIGHT={
  tx:-.7071,ty:-.7071,
  k:LOOK.light,
  shLen:.5,shAmt:.7
};

function nextMood(){

  const names=Object.keys(MOODS);

  let pick=ENV.label;

  for(let tries=0;tries<8&&pick===ENV.label;tries++){

    let total=0;
    names.forEach(n=>total+=MOOD_WEIGHTS[n]);

    let r=Math.random()*total;

    for(const n of names){
      r-=MOOD_WEIGHTS[n];
      if(r<=0){pick=n;break;}
    }
  }

  ENV.label=pick;
  ENV.mood=MOODS[pick];
  ENV.dir=Math.random()<.5?-1:1;
  ENV.timer=
    (CFG.weatherMin+
     Math.random()*(CFG.weatherMax-CFG.weatherMin))*1000;
}

function updateEnv(dt){

  ENV.t+=dt/1000;

  if(CFG.forceTime==null){
    ENV.phase=
      (ENV.phase+dt/(CFG.daySeconds*1000))%1;
  }

  if(CFG.forceWeather==null){
    ENV.timer-=dt;
    if(ENV.timer<=0)nextMood();
  }

  const lf=1-Math.exp(-.0002*dt);

  ENV.turb+=(ENV.mood.turb-ENV.turb)*lf;
  ENV.wind+=(ENV.mood.wind*ENV.dir-ENV.wind)*lf;
  ENV.rain+=(ENV.mood.rain-ENV.rain)*lf;
  ENV.over+=(ENV.mood.over-ENV.over)*lf;

  /* Things get wet quickly and dry slowly. */
  const wt=Math.min(1,ENV.rain*2.2);

  ENV.wet+=
    (wt-ENV.wet)*
    (1-Math.exp(-dt*(wt>ENV.wet?.0008:.0003)));

  /* Blend neighbouring time-of-day keyframes. */
  const p=ENV.phase*4;
  const i0=Math.floor(p)%4;
  const i1=(i0+1)%4;

  let f=p-Math.floor(p);
  f=f*f*(3-2*f);

  const A=KEYS[i0],B=KEYS[i1];

  const mix=(a,b)=>a+(b-a)*f;
  const mix3=(a,b)=>[mix(a[0],b[0]),mix(a[1],b[1]),mix(a[2],b[2])];

  ENV.grade=mix3(A.grade,B.grade);
  ENV.glow=mix3(A.glow,B.glow);
  ENV.glowAmt=mix(A.glowAmt,B.glowAmt);
  ENV.rainCol=mix3(A.rain,B.rain);

  const g=ENV.grade;

  ENV.hi=[
    250*g[0]/255,
    245*g[1]/255,
    235*g[2]/255
  ];

  let tx=mix(A.tx,B.tx),ty=mix(A.ty,B.ty);
  const tl=Math.hypot(tx,ty)||1;

  LIGHT.tx=tx/tl;
  LIGHT.ty=ty/tl;
  LIGHT.k=LOOK.light*mix(A.lit,B.lit)*(1-.55*ENV.over);
  LIGHT.shLen=mix(A.shLen,B.shLen);
  LIGHT.shAmt=mix(A.shAmt,B.shAmt)*(1-.85*ENV.over);
}


/* =========================================================
   STATE
========================================================= */

let stones=[];
let petals=[];
let petalBase=16;
let ripples=[];
let raindrops=[];

const pointers=new Map();

let activeStone=null;
let activePointer=null;

let rakeStroke=null;
let stoneStroke=null;

let tap=null;
let lastSmooth=null;
let smoothing=false;
let longPressTimer=null;
let firstInteraction=true;

let hf=null;       // height field
let tone=null;     // static grain + vignette multiplier
let img=null;      // ImageData for sand canvas
let dirty=null;    // dirty rectangle (tool work)
let dirtySmall=[]; // tiny dirty rects (rain pits)

let lastShaded={tx:LIGHT.tx,ty:LIGHT.ty,k:LIGHT.k};
let sweepRef=null;
let sweepY=-1;


/* =========================================================
   SMALL UTILITIES
========================================================= */

function clamp(v,a,b){
  return Math.max(a,Math.min(b,v));
}

function lerp(a,b,t){
  return a+(b-a)*t;
}

function rand(a,b){
  return a+Math.random()*(b-a);
}

function pick(arr){
  return arr[(Math.random()*arr.length)|0];
}

function hash(x){
  const s=Math.sin(x*127.1+311.7)*43758.5453;
  return s-Math.floor(s);
}

/* Smooth value noise: coherent variation along a stroke. */
function noise1(x){
  const i=Math.floor(x);
  const f=x-i;
  const u=f*f*(3-2*f);
  return lerp(hash(i),hash(i+1),u);
}


/* =========================================================
   SAND ALLOCATION / RESIZE
========================================================= */

function buildTone(){

  tone=new Float32Array(W*H);

  const cx=W/2,cy=H/2;
  const rIn=Math.min(W,H)*.18;
  const rOut=Math.max(W,H)*.76;
  const g=LOOK.grain;

  for(let y=0;y<H;y++){
    const dy=y-cy;
    for(let x=0;x<W;x++){
      const dx=x-cx;
      let t=(Math.sqrt(dx*dx+dy*dy)-rIn)/(rOut-rIn);
      t=t<0?0:t>1?1:t;
      tone[y*W+x]=
        (1+.02*(1-t)-.085*t)+
        (Math.random()-.5)*g;
    }
  }
}

function rebuild(nW,nH){

  const oldHf=hf,oW=W,oH=H;

  const sameOrientation=
    !!oldHf && ((oW>oH)===(nW>nH));

  W=nW;
  H=nH;

  sand.width=W;
  sand.height=H;

  img=sctx.createImageData(W,H);
  hf=new Float32Array(W*H);
  buildTone();

  dirty=null;
  dirtySmall=[];
  sweepY=-1;
  lastShaded={tx:LIGHT.tx,ty:LIGHT.ty,k:LIGHT.k};

  if(sameOrientation){

    /* Same orientation: keep the drawing (resampled). */
    for(let y=0;y<H;y++){
      const sy=Math.min(oH-1,(y*oH/H)|0);
      for(let x=0;x<W;x++){
        const sx=Math.min(oW-1,(x*oW/W)|0);
        hf[y*W+x]=oldHf[sy*oW+sx];
      }
    }

    stones.forEach(s=>{
      s.x*=W/oW;
      s.y*=H/oH;
    });

    if(rake.placed){
      rake.hx*=W/oW;
      rake.hy*=H/oH;
    }

  }else if(stones.length){

    /* Rotated: fresh sand, stones keep relative place. */
    stones.forEach(s=>{
      s.x*=W/oW;
      s.y*=H/oH;
    });

    if(rake.placed){
      rake.hx*=W/oW;
      rake.hy*=H/oH;
    }

    stones.forEach(stoneRings);

  }else{

    makeInitialStones();
  }

  markDirty(0,0,W-1,H-1);
}

function resize(){

  const iw=innerWidth,ih=innerHeight;

  DPR=Math.min(window.devicePixelRatio||1,2);

  canvas.width=Math.round(iw*DPR);
  canvas.height=Math.round(ih*DPR);

  canvas.style.width=iw+"px";
  canvas.style.height=ih+"px";

  const S=600/Math.min(iw,ih);
  const nW=Math.round(iw*S);
  const nH=Math.round(ih*S);

  K=canvas.width/nW;
  UPP=nW/iw;
  RAKE.turn=CFG.steerPx*UPP;

  if(nW!==W||nH!==H)rebuild(nW,nH);
}


/* =========================================================
   HEIGHT FIELD -> PIXELS
========================================================= */

function markDirty(x0,y0,x1,y1){

  if(!dirty){
    dirty={x0,y0,x1,y1};
    return;
  }

  if(x0<dirty.x0)dirty.x0=x0;
  if(y0<dirty.y0)dirty.y0=y0;
  if(x1>dirty.x1)dirty.x1=x1;
  if(y1>dirty.y1)dirty.y1=y1;
}

/*
  Light comes from LIGHT.tx/ty (toward the light).
  A surface rising away from the light faces it and is lit.
*/
function shadeRect(x0,y0,x1,y1){

  x0=Math.max(0,x0);
  y0=Math.max(0,y0);
  x1=Math.min(W-1,x1);
  y1=Math.min(H-1,y1);

  if(x1<x0||y1<y0)return;

  const d=img.data;
  const kx=-LIGHT.k*LIGHT.tx;
  const ky=-LIGHT.k*LIGHT.ty;
  const AO=LOOK.ao;
  const br=SAND[0],bg=SAND[1],bb=SAND[2];

  for(let y=y0;y<=y1;y++){

    const row=y*W;
    const up=y>0?row-W:row;
    const dn=y<H-1?row+W:row;

    for(let x=x0;x<=x1;x++){

      const i=row+x;
      const l=x>0?i-1:i;
      const r=x<W-1?i+1:i;

      const gx=(hf[r]-hf[l])*.5;
      const gy=(hf[dn+x]-hf[up+x])*.5;

      let f=1+kx*gx+ky*gy+AO*hf[i];

      if(f<.6)f=.6;
      f*=tone[i];

      const j=i*4;

      d[j]=br*f;
      d[j+1]=bg*f;
      d[j+2]=bb*f;
      d[j+3]=255;
    }
  }

  sctx.putImageData(
    img,0,0,
    x0,y0,
    x1-x0+1,y1-y0+1
  );
}

function lightDelta(a,b){
  return Math.abs(a.tx-b.tx)+
         Math.abs(a.ty-b.ty)+
         Math.abs(a.k-b.k)*3;
}

function flushSand(){

  if(dirty){

    const r=dirty;
    dirty=null;

    shadeRect(r.x0-1,r.y0-1,r.x1+1,r.y1+1);
  }

  if(dirtySmall.length){

    for(const r of dirtySmall)
      shadeRect(r.x0-1,r.y0-1,r.x1+1,r.y1+1);

    dirtySmall.length=0;
  }

  /*
    When the sun has moved enough, re-light the whole field
    a band of rows per frame, so it never causes a hitch.
  */
  if(sweepY<0&&lightDelta(LIGHT,lastShaded)>.025){
    sweepY=0;
    sweepRef={tx:LIGHT.tx,ty:LIGHT.ty,k:LIGHT.k};
  }

  if(sweepY>=0){

    const rows=Math.max(24,Math.ceil(H/20));
    const y1=Math.min(H-1,sweepY+rows-1);

    shadeRect(0,sweepY,W-1,y1);

    sweepY=y1+1;

    if(sweepY>=H){
      sweepY=-1;
      lastShaded=sweepRef;
    }
  }
}


/* =========================================================
   TOOL FOOTPRINTS (the only code that edits the sand)
========================================================= */

/*
  Stones are solid: tools never alter sand under them,
  so grooves end cleanly at a stone edge.
*/
function blockersFor(x0,y0,x1,y1){

  const out=[];

  for(const s of stones){

    if(s===activeStone)continue;

    const R=s.rb;

    if(
      s.x+R<x0||s.x-R>x1||
      s.y+R<y0||s.y-R>y1
    )continue;

    out.push(s);
  }

  return out;
}

function blocked(bl,x,y){

  for(let k=0;k<bl.length;k++){

    const s=bl[k],R=s.rb;
    const dx=x-s.x,dy=y-s.y;

    if(dx*dx+dy*dy<R*R)return true;
  }

  return false;
}

function underStone(x,y){

  for(const s of stones){
    const dx=x-s.x,dy=y-s.y;
    if(dx*dx+dy*dy<s.rb*s.rb)return true;
  }

  return false;
}

/*
  Oriented slab: u along heading (half length hl),
  s across it. Inside |s|<=hb the target height
  fn(s) fully REPLACES the sand; it fades out over
  `edge` beyond that.
*/
function applyBand(cx,cy,ux,uy,hl,hb,edge,fn,k){

  const nx=-uy,ny=ux;
  const ext=hb+edge;

  const ex=Math.abs(ux)*hl+Math.abs(nx)*ext;
  const ey=Math.abs(uy)*hl+Math.abs(ny)*ext;

  const x0=Math.max(0,Math.floor(cx-ex));
  const x1=Math.min(W-1,Math.ceil(cx+ex));
  const y0=Math.max(0,Math.floor(cy-ey));
  const y1=Math.min(H-1,Math.ceil(cy+ey));

  if(x1<x0||y1<y0)return;

  const bl=blockersFor(x0,y0,x1,y1);

  for(let y=y0;y<=y1;y++){

    const dy=y-cy;

    /*
      For this row, solve where the slab can be, so a long
      diagonal rake doesn't scan its whole bounding box.
    */
    let lo=-1e9,hi=1e9;

    if(ux>1e-4||ux<-1e-4){
      let a=(-hl-dy*uy)/ux,b=(hl-dy*uy)/ux;
      if(a>b){const t=a;a=b;b=t;}
      if(a>lo)lo=a;
      if(b<hi)hi=b;
    }else if(dy*uy>hl||dy*uy<-hl)continue;

    if(uy>1e-4||uy<-1e-4){
      let a=(dy*ux-ext)/uy,b=(dy*ux+ext)/uy;
      if(a>b){const t=a;a=b;b=t;}
      if(a>lo)lo=a;
      if(b<hi)hi=b;
    }else if(dy*ux>ext||dy*ux<-ext)continue;

    if(lo>hi)continue;

    const xs=Math.max(x0,Math.ceil(cx+lo));
    const xe=Math.min(x1,Math.floor(cx+hi));

    for(let x=xs;x<=xe;x++){

      const dx=x-cx;

      const u=dx*ux+dy*uy;
      if(u>hl||u<-hl)continue;

      const sv=dx*nx+dy*ny;
      const as=sv<0?-sv:sv;
      if(as>ext)continue;

      if(bl.length&&blocked(bl,x,y))continue;

      let w=1;

      if(as>hb){
        const t=(as-hb)/edge;
        w=1-t*t*(3-2*t);
      }

      const i=y*W+x;
      hf[i]+=(fn(sv)-hf[i])*w*k;
    }
  }

  markDirty(x0,y0,x1,y1);
}

/*
  Circular footprint. fn(rho,dx,dy) -> target height.
  fn may set diskW (0..1) to fade its own outer edge.
*/
let diskW=1;

function applyDisk(cx,cy,R,edge,fn,k){

  const ext=R+edge;

  const x0=Math.max(0,Math.floor(cx-ext));
  const x1=Math.min(W-1,Math.ceil(cx+ext));
  const y0=Math.max(0,Math.floor(cy-ext));
  const y1=Math.min(H-1,Math.ceil(cy+ext));

  if(x1<x0||y1<y0)return;

  const bl=blockersFor(x0,y0,x1,y1);

  for(let y=y0;y<=y1;y++){

    const dy=y-cy;

    for(let x=x0;x<=x1;x++){

      const dx=x-cx;
      const rho=Math.sqrt(dx*dx+dy*dy);

      if(rho>ext)continue;
      if(bl.length&&blocked(bl,x,y))continue;

      let w=1;

      if(rho>R){
        const t=(rho-R)/edge;
        w=1-t*t*(3-2*t);
      }

      diskW=1;
      const target=fn(rho,dx,dy);
      w*=diskW;

      if(w<=0)continue;

      const i=y*W+x;
      hf[i]+=(target-hf[i])*w*k;
    }
  }

  markDirty(x0,y0,x1,y1);
}

/*
  A raindrop dimple. Only digs where the sand is shallower
  than the dimple, so raked grooves are never filled in.
*/
function pit(cx,cy){

  if(CFG.rainPits<=0)return;

  const R=1.9,R2=R*R;
  const depth=-CFG.rainPits;

  const x0=Math.max(0,Math.floor(cx-R));
  const x1=Math.min(W-1,Math.ceil(cx+R));
  const y0=Math.max(0,Math.floor(cy-R));
  const y1=Math.min(H-1,Math.ceil(cy+R));

  if(x1<x0||y1<y0)return;

  for(let y=y0;y<=y1;y++){
    const dy=y-cy;
    for(let x=x0;x<=x1;x++){

      const dx=x-cx;
      const d2=dx*dx+dy*dy;
      if(d2>R2)continue;

      const target=depth*(1-d2/R2);
      const i=y*W+x;

      if(hf[i]>target)hf[i]+=(target-hf[i])*.8;
    }
  }

  dirtySmall.push({x0,y0,x1,y1});
}


/* =========================================================
   STROKE ENGINE
   ---------------------------------------------------------
   Raw pointer events are irregular and jittery. A stroke:
     1. low-pass filters the pointer position,
     2. walks the path in FIXED steps (STEP), so result
        never depends on finger speed or event rate,
     3. keeps a smoothed heading, so the tool turns in
        smooth arcs instead of fanning on jitter.
========================================================= */

function newStroke(cfg,p,kind,h0){

  return{
    cfg,
    kind,
    px:p.x,py:p.y,       // filtered pointer
    lx:p.x,ly:p.y,       // last stamped position
    hx:h0?h0.x:1,        // smoothed heading
    hy:h0?h0.y:0,
    keepH0:!!h0,         // start from the rake's own heading
    dth:0,               // heading change per step
    align:0,             // how squarely the move follows the heading
    ready:false,
    dist:0,
    seed:Math.random()*61000,
    tooth:[],
    stone:null
  };
}

function strokeMove(s,p,hd){

  s.px+=(p.x-s.px)*FOLLOW;
  s.py+=(p.y-s.py)*FOLLOW;

  let dx=s.px-s.lx;
  let dy=s.py-s.ly;
  let d=Math.hypot(dx,dy);

  if(!s.ready){

    if(d<DEAD)return;

    const ux0=dx/d,uy0=dy/d;

    if(hd){

      s.hx=hd.x;
      s.hy=hd.y;

    }else if(s.keepH0){

      /* Keep the rake's own heading, pointing the way we go. */
      if(s.hx*ux0+s.hy*uy0<0){
        s.hx=-s.hx;
        s.hy=-s.hy;
      }

    }else{

      s.hx=ux0;
      s.hy=uy0;
    }

    s.align=Math.abs(ux0*s.hx+uy0*s.hy);
    s.ready=true;

    stampAt(s);
  }

  const a=1-Math.exp(-STEP/s.cfg.turn);

  let guard=0;

  while(d>=STEP&&guard++<600){

    const ux=dx/d,uy=dy/d;

    const ohx=s.hx,ohy=s.hy;

    if(hd){

      /* Heading is dictated (two fingers hold the bar). */
      s.hx=hd.x;
      s.hy=hd.y;

    }else{

      /* A bar has no front or back: turn the short way. */
      if(s.hx*ux+s.hy*uy<0){
        s.hx=-s.hx;
        s.hy=-s.hy;
      }

      s.hx+=(ux-s.hx)*a;
      s.hy+=(uy-s.hy)*a;

      const hl=Math.hypot(s.hx,s.hy);

      if(hl<1e-3){
        s.hx=ux;
        s.hy=uy;
      }else{
        s.hx/=hl;
        s.hy/=hl;
      }
    }

    /* Pulled square to its heading it digs; skidding sideways doesn't. */
    s.align=Math.abs(ux*s.hx+uy*s.hy);

    s.dth=Math.abs(ohx*s.hy-ohy*s.hx);

    s.lx+=ux*STEP;
    s.ly+=uy*STEP;
    s.dist+=STEP;

    stampAt(s);

    dx=s.px-s.lx;
    dy=s.py-s.ly;
    d=Math.hypot(dx,dy);
  }

  /* Huge jump: don't try to fill, just resync. */
  if(guard>=600){
    s.lx=s.px;
    s.ly=s.py;
  }
}

function stampAt(s){
  if(s.kind==="wake")wakeStamp(s);
  else rakeStamp(s);
}


/* =========================================================
   RAKE
========================================================= */

/*
  The rake is a rigid bar of tines. Everywhere inside the
  bar's band the sand becomes the tine pattern:
  groove under each tine, small shoulders beside it, flat
  between. Crossing an old pattern therefore REPLACES it.
*/
function rakeStamp(s){

  /* Sliding the head along its own length digs nothing. */
  if(s.align<.3)return;

  const c=s.cfg;
  const n=c.tines;
  const half=(n-1)/2;

  /* Gentle coherent depth variation per tine. */
  for(let i=0;i<n;i++){
    s.tooth[i]=
      .84+.16*noise1(
        s.dist*.025+i*1.73+s.seed
      );
  }

  const tooth=s.tooth;

  const prof=function(sv){

    let k=Math.round(sv/c.spacing+half);

    if(k<0)k=0;
    else if(k>n-1)k=n-1;

    const d=sv-(k-half)*c.spacing;
    const q=d/c.w;
    const q2=q*q;

    return -c.depth*tooth[k]*(1-q2)*Math.exp(-q2);
  };

  const hb=half*c.spacing+c.spacing*.75;
  const edge=c.spacing*.5;

  /* Slab length grows on tight turns so the outer edge
     of the band never leaves gaps. */
  const hl=STEP*.75+(hb+edge)*s.dth*.5;

  applyBand(
    s.lx,s.ly,
    s.hx,s.hy,
    hl,hb,edge,
    prof,1
  );

  /* Settled petals in the rake's path get swept up. */
  disturbPetalsBand(s.lx,s.ly,s.hx,s.hy,hb);
}


/* =========================================================
   STONE WAKE  (plough furrow behind a dragged stone)
========================================================= */

function wakeStamp(s){

  const r=s.stone.r;
  const w=r*.42;

  const prof=function(sv){
    const q=sv/w,q2=q*q;
    return -RAKE.depth*.65*(1-q2)*Math.exp(-q2);
  };

  const hl=STEP*.75+r*1.4*s.dth*.5;

  applyBand(
    s.lx,s.ly,
    s.hx,s.hy,
    hl,r,r*.4,
    prof,1
  );
}


/* =========================================================
   STONE RINGS  (raked rings that hug each stone's outline)
========================================================= */

function stoneRings(st){

  const sp=7.5;
  const N=st.rings;
  const o0=9;                          // gap from stone to ring 1
  const outer=o0+(N-1)*sp+sp*.8;       // end of the ring zone

  const R=st.extent+outer+4;

  applyDisk(
    st.x,st.y,
    R,6,
    function(rho,dx,dy){

      const ang=Math.atan2(dy,dx);

      /* Distance outside the stone's own outline. */
      const off=rho-st.bnd(ang);

      /* Periodic wobble: closed, organic, never a
         sterile mathematical circle. */
      const wob=
        rho*.02*(
          Math.sin(ang*2+st.ph1)*.6+
          Math.sin(ang*3+st.ph2)*.4
        );

      const rr=off-wob;

      /* Fade out beyond the last ring. */
      if(rr>outer){
        const t=(rr-outer)/6;
        diskW=t>=1?0:1-t*t*(3-2*t);
      }

      let k=Math.round((rr-o0)/sp);

      if(k<0)k=0;
      else if(k>N-1)k=N-1;

      const d=rr-(o0+k*sp);
      const q=d/2.1,q2=q*q;

      return -RAKE.depth*.85*(1-q2)*Math.exp(-q2);
    },
    1
  );
}


/* =========================================================
   LOCAL SMOOTHING (long press + drag)
========================================================= */

function smoothAt(x,y){
  applyDisk(x,y,20,26,()=>0,.3);
}

function smoothTo(p){

  const a=lastSmooth||p;

  const d=Math.hypot(p.x-a.x,p.y-a.y);
  const n=Math.max(1,Math.ceil(d/8));

  for(let i=1;i<=n;i++){
    smoothAt(
      lerp(a.x,p.x,i/n),
      lerp(a.y,p.y,i/n)
    );
  }

  lastSmooth=p;
}


/* =========================================================
   STONES  (randomised every run)
========================================================= */

/* [highlight, mid, shadow] */
const STONE_FAMILIES={
  basalt: [[98,94,86],  [60,58,54],  [37,36,33]],
  slate:  [[108,116,126],[66,72,80], [40,44,50]],
  granite:[[160,148,134],[110,100,90],[70,62,56]],
  moss:   [[100,112,88],[62,72,56],  [38,44,36]],
  tea:    [[142,106,92],[96,68,58],  [58,40,34]]
};

const FAMILY_WEIGHTS=[
  ["basalt",3],["slate",2],["granite",2],["moss",1],["tea",1]
];

function pickFamily(){

  let total=0;
  FAMILY_WEIGHTS.forEach(f=>total+=f[1]);

  let r=Math.random()*total;

  for(const f of FAMILY_WEIGHTS){
    r-=f[1];
    if(r<=0)return f[0];
  }

  return "basalt";
}

/* Each run leans toward a primary and a secondary family. */
let famPrimary="basalt",famSecondary="slate";

function pickStoneFamily(){

  const r=Math.random();

  if(r<.65)return famPrimary;
  if(r<.88)return famSecondary;

  return pickFamily();
}

class Stone{

  constructor(x,y,r,o){

    this.x=x;
    this.y=y;
    this.r=r;

    this.e=o.e;
    this.rot=o.rot;
    this.rings=o.rings;

    /* Semi-axes of the stone's overall ellipse. */
    this.A=r*(1+o.e);
    this.B=r*(1-o.e);

    this.extent=this.A*1.04;   // furthest reach from centre
    this.rb=this.B*.8;         // solid core (tools can't edit)

    this.dragDX=0;
    this.dragDY=0;

    this.ph1=rand(0,Math.PI*2);
    this.ph2=rand(0,Math.PI*2);

    /* Colours with a little per-stone brightness drift. */
    const fam=STONE_FAMILIES[o.family];
    const j=.88+Math.random()*.24;

    this.pal=fam.map(c=>[
      clamp(c[0]*j,0,255),
      clamp(c[1]*j,0,255),
      clamp(c[2]*j,0,255)
    ]);

    /* Outline. */
    const n=o.n;
    const cr=Math.cos(o.rot),sr=Math.sin(o.rot);

    const pts=[];

    for(let i=0;i<n;i++){

      const a=i/n*Math.PI*2;
      const w=.86+Math.random()*.18;

      const lx=Math.cos(a)*this.A*w;
      const ly=Math.sin(a)*this.B*w;

      pts.push({
        x:lx*cr-ly*sr,
        y:lx*sr+ly*cr
      });
    }

    this.points=pts;

    const path=new Path2D();

    path.moveTo(
      (pts[n-1].x+pts[0].x)/2,
      (pts[n-1].y+pts[0].y)/2
    );

    for(let i=0;i<n;i++){

      const a=pts[i],b=pts[(i+1)%n];

      path.quadraticCurveTo(
        a.x,a.y,
        (a.x+b.x)/2,
        (a.y+b.y)/2
      );
    }

    path.closePath();

    this.path=path;

    /* Surface flecks: unique texture per stone. */
    this.flecks=[];

    const fc=Math.floor(rand(3,9)*(r/30)+2);

    for(let i=0;i<fc;i++){

      const a=rand(0,Math.PI*2);
      const d=Math.sqrt(Math.random())*this.B*.78;
      const rx=rand(.7,2.6)*(.6+r/50);

      this.flecks.push({
        x:Math.cos(a)*d,
        y:Math.sin(a)*d,
        rx,
        ry:rx*rand(.4,.9),
        rot:rand(0,Math.PI),
        a:rand(.07,.20),
        light:Math.random()<.6
      });
    }
  }

  /* Radius of the stone outline in a given direction. */
  bnd(ang){

    const a=ang-this.rot;
    const c=Math.cos(a),s=Math.sin(a);

    return .96*this.A*this.B/
      Math.sqrt(
        this.B*c*this.B*c+
        this.A*s*this.A*s
      );
  }

  contains(x,y){
    return Math.hypot(x-this.x,y-this.y)<
      Math.max(26,this.extent*1.12);
  }

  draw(){

    const g=ENV.grade;
    const wet=ENV.wet;
    const L=LIGHT;
    const ext=this.extent;

    const lum=(g[0]+g[1]+g[2])/765;

    ctx.save();
    ctx.translate(this.x,this.y);

    /*
      Ground shadow. Falls away from the sun; long at dawn
      and dusk, short at noon, faint under cloud.
      (Gradient, no ctx.filter: iOS Safari lacks canvas filters.)
    */
    const sa=.32*L.shAmt;

    if(sa>.01){

      const dx=-L.tx,dy=-L.ty;
      const reach=ext*(.12+.5*L.shLen);

      ctx.save();
      ctx.translate(dx*reach,dy*reach);
      ctx.rotate(Math.atan2(dy,dx));
      ctx.scale(1+.9*L.shLen,.8);

      const sh=ctx.createRadialGradient(
        0,0,ext*.2,
        0,0,ext*1.3
      );

      sh.addColorStop(0,"rgba(30,26,22,"+sa+")");
      sh.addColorStop(.6,"rgba(30,26,22,"+(sa*.62)+")");
      sh.addColorStop(1,"rgba(30,26,22,0)");

      ctx.fillStyle=sh;
      ctx.beginPath();
      ctx.arc(0,0,ext*1.3,0,Math.PI*2);
      ctx.fill();
      ctx.restore();
    }

    /*
      Body: lit from the sun side, tinted by the time of day,
      darker when wet.
    */
    const k=(1-.22*wet)/255;
    const pal=this.pal;

    const col=function(c){
      return "rgb("+
        ((c[0]*g[0]*k)|0)+","+
        ((c[1]*g[1]*k)|0)+","+
        ((c[2]*g[2]*k)|0)+")";
    };

    const gr=ctx.createLinearGradient(
      L.tx*ext,L.ty*ext,
      -L.tx*ext,-L.ty*ext
    );

    gr.addColorStop(0,col(pal[0]));
    gr.addColorStop(.48,col(pal[1]));
    gr.addColorStop(1,col(pal[2]));

    ctx.fillStyle=gr;
    ctx.fill(this.path);

    ctx.save();
    ctx.clip(this.path);

    /* Flecks */
    for(const f of this.flecks){

      ctx.beginPath();
      ctx.ellipse(f.x,f.y,f.rx,f.ry,f.rot,0,Math.PI*2);

      ctx.fillStyle=f.light
        ?"rgba(255,250,240,"+(f.a*lum)+")"
        :"rgba(0,0,0,"+f.a+")";

      ctx.fill();
    }

    /* Sheen: stronger when wet, softer under cloud. */
    const ha=
      (.07*(1-.6*ENV.over)+.22*wet)*Math.sqrt(lum);

    if(ha>.01){

      const hx=L.tx*ext*.45,hy=L.ty*ext*.45;

      const hg=ctx.createRadialGradient(
        hx,hy,0,
        hx,hy,ext*.75
      );

      hg.addColorStop(0,"rgba(255,250,240,"+ha+")");
      hg.addColorStop(1,"rgba(255,250,240,0)");

      ctx.fillStyle=hg;
      ctx.fillRect(-ext,-ext,ext*2,ext*2);
    }

    ctx.restore();

    ctx.strokeStyle="rgba(255,255,255,"+(.08*lum)+")";
    ctx.lineWidth=1;
    ctx.stroke(this.path);

    ctx.restore();
  }
}

function makeStone(x,y,r){

  const e=Math.random()<.5?rand(0,.1):rand(.1,.3);

  return new Stone(x,y,r,{
    e,
    rot:rand(0,Math.PI),
    n:Math.floor(rand(9,14)),
    family:pickStoneFamily(),
    rings:clamp(3+Math.round(r/12),4,7)
  });
}

/*
  Zen-style composition: a few groups, each a big stone with
  0-2 smaller companions leaning close, spread so their rings
  have room. Different every run.
*/
function layoutStones(){

  const out=[],placed=[];

  const groups=
    2+
    (Math.random()<.55?1:0)+
    (W*H>800000&&Math.random()<.5?1:0);

  for(let g=0;g<groups;g++){

    const r0=lerp(22,50,Math.pow(Math.random(),.75));

    const roll=Math.random();
    const kidN=roll<.30?0:roll<.72?1:2;

    const mem=[{dx:0,dy:0,r:r0}];

    for(let k=0;k<kidN;k++){

      const rc=r0*rand(.32,.68);

      for(let t=0;t<12;t++){

        const a=rand(0,Math.PI*2);
        const d=r0+rc+rand(4,14);

        const dx=Math.cos(a)*d;
        const dy=Math.sin(a)*d;

        if(mem.every(m=>Math.hypot(m.dx-dx,m.dy-dy)>m.r+rc+3)){
          mem.push({dx,dy,r:rc});
          break;
        }
      }
    }

    let gR=0;

    mem.forEach(m=>{
      gR=Math.max(gR,Math.hypot(m.dx,m.dy)+m.r*1.3);
    });

    const mg=gR+54;

    if(W<2*mg||H<2*mg)continue;

    for(let t=0;t<300;t++){

      const cx=rand(mg,W-mg);
      const cy=rand(mg,H-mg);

      if(placed.every(p=>Math.hypot(p.x-cx,p.y-cy)>p.R+gR+34)){

        placed.push({x:cx,y:cy,R:gR});

        mem.forEach(m=>{
          out.push(makeStone(cx+m.dx,cy+m.dy,m.r));
        });

        break;
      }
    }
  }

  if(!out.length)out.push(makeStone(W/2,H/2,34));

  return out;
}

function makeInitialStones(){

  famPrimary=pickFamily();
  famSecondary=pickFamily();

  stones=layoutStones();

  stones.forEach(stoneRings);
}

   PETALS / LEAVES  (theme chosen fresh every run)

  {
    shape:"petal",n:[12,24],size:[3.5,7.5],alpha:[.34,.72],
    cols:[[239,211,216],[245,190,205],[250,225,230]]        // sakura
  },
  {
    shape:"petal",n:[10,20],size:[3,6],alpha:[.5,.85],
    cols:[[250,244,240],[246,214,214],[255,255,255]]        // plum
  },
  {
    shape:"leaf", n:[8,16], size:[5,9],alpha:[.55,.9],
    cols:[[196,70,40],[222,110,50],[170,50,38],[230,150,60]] // maple
  },
  {
    shape:"fan",  n:[8,16], size:[5,8],alpha:[.6,.9],
    cols:[[232,196,60],[244,214,90],[210,170,40]]           // ginkgo
  },

    cols:[[190,170,220],[210,190,235],[165,145,205]]        // wisteria
  },

    cols:[[170,190,110],[190,205,130],[150,172,96]]         // willow
  }
];

class Petal{

  constructor(theme){

    this.th=theme;
    this.dead=false;

    this.reset(true);
  }

  reset(initial=false){

    const th=this.th;
    const w=ENV.wind;

    /* Spawn upwind so drifting petals still cross the view. */
    this.x=rand(
      -60-Math.max(0,w)*80,
      W+60+Math.max(0,-w)*80
    );

    this.y=initial?rand(-20,H):-30;

    this.size=rand(th.size[0],th.size[1]);
    this.speed=rand(.25,.7);
    this.drift=rand(.12,.42);
    this.windK=rand(.6,1.4);

    this.angle=rand(0,Math.PI*2);
    this.spin=rand(-.018,.018);
    this.phase=rand(0,Math.PI*2);

    this.tumble=rand(0,Math.PI*2);
    this.tumbleRate=rand(.02,.06);

    this.alpha=rand(th.alpha[0],th.alpha[1]);

    const base=pick(th.cols);
    const j=.92+Math.random()*.16;

    this.col=[
      clamp(base[0]*j,0,255),
      clamp(base[1]*j,0,255),
      clamp(base[2]*j,0,255)
    ];

    /* Settling: mode "fly" or "rest"; rest eases 0 -> 1. */
    this.mode="fly";
    this.rest=0;
    this.restTimer=0;

    /* Height above the sand, drives the shadow offset. */
    this.zFly=rand(22,70);
    this.z=this.zFly;

    this.kx=0;
    this.ky=0;
    this.buoy=0;
  }

  /* A resting petal is blown or swept off the sand. */
  lift(kx,ky){

    if(this.mode!=="rest")return;

    this.mode="fly";
    this.kx+=kx;
    this.ky+=ky;
    this.buoy=1;
    this.zFly=rand(18,50);
  }

  update(fs,keepAlive,canLand){

    const w=ENV.wind;
    const aw=Math.min(1,Math.abs(w));

    const target=this.mode==="rest"?1:0;

    /* Settles quickly, lifts away slowly. */
    this.rest+=
      (target-this.rest)*
      (1-Math.exp(-(target?.08:.03)*fs));

    if(target&&this.rest>.985)this.rest=1;
    if(!target&&this.rest<.01)this.rest=0;

    const fly=1-this.rest;

    if(fly>0){

      /* Wind gusts, slightly out of phase per petal. */
      const gust=1+.35*Math.sin(ENV.t*1.7+this.phase);

      this.y+=
        (this.speed*(1+.5*Math.abs(w))+ENV.wet*.4)*fly*fs;

      this.x+=
        (this.drift*(1-.8*aw)+
         w*this.windK*1.1*gust+
         Math.sin(this.y*.017+this.phase)*.22)*fly*fs;

      this.angle+=this.spin*(1+Math.abs(w)*2)*fly*fs;
      this.tumble+=this.tumbleRate*(1+Math.abs(w))*fly*fs;
    }

    /* Floating away: a few seconds of lift and drift. */
    if(this.buoy>.01){

      this.y-=this.buoy*1.1*fs;
      this.x+=this.buoy*(w>=0?1:-1)*.7*fs;

      this.buoy*=Math.pow(.988,fs);
    }

    if(this.kx||this.ky){

      this.x+=this.kx*fs;
      this.y+=this.ky*fs;

      const dmp=Math.pow(.93,fs);

      this.kx*=dmp;
      this.ky*=dmp;

      if(Math.abs(this.kx)+Math.abs(this.ky)<.01){
        this.kx=0;
        this.ky=0;
      }
    }

    this.z=lerp(this.zFly,.5,this.rest);

    if(this.mode==="rest"){

      if(this.rest>=1){

        this.restTimer-=fs/60;

        if(this.restTimer<=0){

          this.lift(w*.6+rand(-.5,.5),-rand(.3,.9));

        }else if(
          aw>.7&&
          Math.random()<(aw-.7)*.03*fs
        ){

          /* A strong gust blows it off. */
          this.lift(w*.9+rand(-.4,.4),-rand(.4,1));
        }
      }

    }else{

      if(
        canLand&&
        this.rest===0&&
        this.buoy<.2&&
        this.y>H*.06&&this.y<H*.94&&
        this.x>10&&this.x<W-10&&
        Math.random()<
          CFG.petalLandChance*fs*
          (1-.8*aw)*
          (1-.9*Math.min(1,ENV.wet*1.5))
      ){
        this.mode="rest";
        this.restTimer=
          rand(CFG.petalRestMin,CFG.petalRestMax);
      }

      if(
        this.y>H+30||this.y<-120||
        this.x<-140||this.x>W+140
      ){
        if(keepAlive)this.reset();
        else this.dead=true;
      }
    }
  }

  /* 0..1 squash: tumbling in the air, flat once settled. */
  flat(){

    const fy=.22+.78*Math.abs(Math.cos(this.tumble));

    return fy+(1-fy)*this.rest;
  }

  trace(fy){

    const th=this.th;
    const s=this.size;

    ctx.beginPath();

    if(th.shape==="leaf"){

      ctx.moveTo(-s,0);
      ctx.quadraticCurveTo(0,-s*.62*fy,s,0);
      ctx.quadraticCurveTo(0,s*.62*fy,-s,0);

    }else if(th.shape==="fan"){

      ctx.moveTo(0,s*.7*fy);
      ctx.lineTo(-s*.95,-s*.35*fy);
      ctx.quadraticCurveTo(0,-s*.95*fy,s*.95,-s*.35*fy);
      ctx.closePath();

    }else{

      ctx.ellipse(0,0,s,s*.46*fy,0,0,Math.PI*2);
    }
  }

  /*
    Shadow on the sand. A petal high in the air throws a
    soft shadow well away from itself; a settled one has a
    tight shadow right beneath it.
  */
  drawShadow(){

    const L=LIGHT;

    const sa=.26*L.shAmt*(1-Math.min(.6,this.z/120));

    if(sa<.01)return;

    const off=(this.z*.55+1.5)*(.45+L.shLen*.9);
    const soft=1+this.z/160;

    ctx.save();

    ctx.translate(
      this.x-L.tx*off,
      this.y-L.ty*off
    );

    ctx.rotate(this.angle);
    ctx.scale(soft,soft);

    this.trace(this.flat());

    ctx.fillStyle="rgba(30,26,22,"+sa+")";
    ctx.fill();

    ctx.restore();
  }

  draw(){

    const th=this.th;
    const g=ENV.grade;
    const k=(1-.18*ENV.wet)/255;

    const fy=this.flat();

    ctx.save();
    ctx.translate(this.x,this.y);
    ctx.rotate(this.angle);

    this.trace(fy);

    ctx.fillStyle=
      "rgba("+
      ((this.col[0]*g[0]*k)|0)+","+
      ((this.col[1]*g[1]*k)|0)+","+
      ((this.col[2]*g[2]*k)|0)+","+
      this.alpha+")";

    ctx.fill();

    if(th.shape==="leaf"&&fy>.45){

      const s=this.size;

      ctx.beginPath();
      ctx.moveTo(-s*.9,0);
      ctx.lineTo(s*.9,0);
      ctx.strokeStyle="rgba(0,0,0,.18)";
      ctx.lineWidth=.6;
      ctx.stroke();
    }

    ctx.restore();
  }
}

function makePetals(){

  const a=pick(PETAL_THEMES);
  let b=a;

  /* Sometimes two kinds of petals mix. */
  if(Math.random()<.3){
    do{b=pick(PETAL_THEMES);}while(b===a);
  }

  petalBase=Math.round(rand(a.n[0],a.n[1]));

  const pool=Math.ceil(petalBase*1.9);

  petals=[];

  for(let i=0;i<pool;i++){

    const p=new Petal(Math.random()<.5?a:b);

    /* Extra pool petals only appear when the wind picks up. */
    if(i>=petalBase)p.dead=true;

    petals.push(p);
  }
}

function updatePetals(fs){

  const act=Math.round(
    petalBase*(1+Math.min(1,Math.abs(ENV.wind))*.9)
  );

  /* Only some petals settle at once. */
  const cap=Math.ceil(petalBase*.4);

  let resting=0;

  for(const p of petals){
    if(!p.dead&&p.mode==="rest")resting++;
  }

  for(let i=0;i<petals.length;i++){

    const p=petals[i];

    if(p.dead){
      if(i<act){
        p.dead=false;
        p.reset(false);
      }else continue;
    }

    const was=p.mode;

    p.update(fs,i<act,resting<cap);

    if(was!=="rest"&&p.mode==="rest")resting++;
  }
}

/* Sweep settled petals out of the rake's footprint. */
function disturbPetalsBand(cx,cy,ux,uy,hb){

  for(const p of petals){

    if(p.dead||p.mode!=="rest")continue;

    const dx=p.x-cx,dy=p.y-cy;

    const u=dx*ux+dy*uy;
    if(u>10||u<-10)continue;

    const sv=-dx*uy+dy*ux;
    if(Math.abs(sv)>hb+4)continue;

    const side=sv<0?-1:1;

    p.lift(
      ux*1.4-uy*side*1.1+rand(-.3,.3),
      uy*1.4+ux*side*1.1+rand(-.3,.3)-.4
    );
  }
}

/* A fingertip brushes settled petals away. */
function disturbPetalsAt(x,y,R){

  for(const p of petals){

    if(p.dead||p.mode!=="rest")continue;

    const dx=p.x-x,dy=p.y-y;
    const d=Math.hypot(dx,dy);

    if(d>R)continue;

    const n=d||1;

    p.lift(
      dx/n*1.6+rand(-.3,.3),
      dy/n*1.6+rand(-.3,.3)-.4
    );
  }
}


/* =========================================================
   RIPPLES (tap rings + rain splashes)
========================================================= */

function ripple(x,y){
  ripples.push({
    x,y,r:2,alpha:.55,
    grow:1.05,fade:.008
  });
}

function splash(x,y){

  if(x<0||x>=W||y<0||y>=H)return;
  if(underStone(x,y))return;

  if(ripples.length<220){
    ripples.push({
      x,y,r:.8,alpha:.32,
      grow:.28,fade:.022
    });
  }

  if(Math.random()<.6)pit(x,y);
}

function updateRipples(fs){

  for(let i=ripples.length-1;i>=0;i--){

    const r=ripples[i];

    r.r+=r.grow*fs;
    r.alpha-=r.fade*fs;

    if(r.alpha<=0)ripples.splice(i,1);
  }
}


/* =========================================================
   RAIN + LIGHTNING
========================================================= */

function updateRain(fs){

  if(ENV.rain>.03){

    const n=ENV.rain*5*fs;

    let c=Math.floor(n);
    if(Math.random()<n-c)c++;

    for(let k=0;k<c;k++){
      raindrops.push({
        x:rand(-90,W+90),
        y:-24,
        vy:rand(16,24)*(1+ENV.turb*.3),
        vx:ENV.wind*4,
        ty:rand(H*.06,H-2)
      });
    }
  }

  for(let i=raindrops.length-1;i>=0;i--){

    const d=raindrops[i];

    d.x+=d.vx*fs;
    d.y+=d.vy*fs;

    if(d.y>=d.ty){

      splash(d.x,d.y);

      raindrops[i]=raindrops[raindrops.length-1];
      raindrops.pop();
      continue;
    }

    if(d.x<-120||d.x>W+120){
      raindrops[i]=raindrops[raindrops.length-1];
      raindrops.pop();
    }
  }
}

function updateLightning(fs){

  if(!CFG.lightning){
    ENV.flash=0;
    return;
  }

  if(ENV.flash>0){

    ENV.flash*=Math.pow(.84,fs);

    if(ENV.flash<.03){
      ENV.flash=0;
    }else if(
      ENV.flash<.35&&
      !ENV.reflashed&&
      Math.random()<.08
    ){
      /* Double flicker. */
      ENV.flash=.8;
      ENV.reflashed=true;
    }

  }else{

    ENV.reflashed=false;

    if(
      ENV.turb>.5&&
      Math.random()<ENV.turb*.004*fs
    ){
      ENV.flash=1;
    }
  }
}


/* =========================================================
   COORDINATES
========================================================= */

function pointerPoint(e){

  const r=canvas.getBoundingClientRect();

  return{
    x:(e.clientX-r.left)*(W/r.width),
    y:(e.clientY-r.top)*(H/r.height)
  };
}

function nearestStone(x,y){

  for(let i=stones.length-1;i>=0;i--){
    if(stones[i].contains(x,y))return stones[i];
  }

  return null;
}


/* =========================================================
   THE RAKE
   ---------------------------------------------------------
   The rake is an object that stays on the sand where you
   leave it. Nothing ever has to happen under your fingertip.

   TWO FINGERS: the head is placed BETWEEN them, as long as
   the gap you hold, with the bar along the line between your
   fingers. Pull the pair sideways to rake; twist to turn it.
   Sliding the head along its own length digs nothing.

   ONE FINGER: touch anywhere. The handle locks to exactly the
   distance and direction from your finger to the rake right
   then ("touch above it and the handle runs down to the
   rake") and the rake follows your finger from there. The
   head turns to follow your stroke, so curves work.

   Lift one of two fingers and the other keeps the handle at
   the distance it already has. A long press smooths the sand
   at the head, in plain view.
========================================================= */

const rake={
  placed:false,   // has it been put on the sand yet
  on:false,       // currently held
  vis:0,
  mode:null,      // "one" | "two"
  hx:0,hy:0,      // head centre
  dx:0,dy:-1,     // heading (square to the bar)
  ox:0,oy:0,      // locked handle: fingertip -> head
  gx:0,gy:0,      // fingertip (one-finger mode)
  f1:null,f2:null,// fingertips (two-finger mode)
  pull:false
};

let smoothCur=null;   // where the smoothing tool is working

/* Where the rake first appears: above the fingertip. */
function headPos(g){

  const L=CFG.headOffsetPx*UPP;

  let f=clamp(g.y/(L*1.6),0,1);
  f=f*f*(3-2*f);

  return{x:g.x,y:g.y-L*f};
}

function placeDefault(g){

  const h=headPos(g);

  rake.placed=true;
  rake.hx=h.x;
  rake.hy=h.y;
  rake.dx=0;
  rake.dy=-1;
}

/* One finger takes hold; the handle keeps the offset it has NOW. */
function rakeGrab(g){

  if(!rake.placed)placeDefault(g);

  rake.on=true;
  rake.mode="one";

  rake.ox=rake.hx-g.x;
  rake.oy=rake.hy-g.y;
  rake.gx=g.x;
  rake.gy=g.y;
  rake.f1=null;
  rake.f2=null;
  rake.pull=true;

  rakeStroke=newStroke(
    RAKE,
    {x:rake.hx,y:rake.hy},
    "rake",
    {x:rake.dx,y:rake.dy}
  );
}

function rakeHold(g){

  /*
    Too long a handle is shortened the first time you move,
    repositioning the rake without digging.
  */
  if(rake.pull){

    rake.pull=false;

    const Lm=CFG.maxHandlePx*UPP;
    const l=Math.hypot(rake.ox,rake.oy);

    if(l>Lm){

      const k=Lm/l;

      rake.ox*=k;
      rake.oy*=k;

      rake.hx=g.x+rake.ox;
      rake.hy=g.y+rake.oy;

      rakeStroke=newStroke(
        RAKE,
        {x:rake.hx,y:rake.hy},
        "rake",
        {x:rake.dx,y:rake.dy}
      );
    }
  }

  rake.gx=g.x;
  rake.gy=g.y;

  const h={x:g.x+rake.ox,y:g.y+rake.oy};

  rake.hx=h.x;
  rake.hy=h.y;

  strokeMove(rakeStroke,h);

  if(rakeStroke.ready){
    rake.dx=rakeStroke.hx;
    rake.dy=rakeStroke.hy;
  }
}

function rakeTwo(a,b){

  const fx=b.x-a.x,fy=b.y-a.y;
  const dist=Math.hypot(fx,fy);

  if(dist<1)return;

  const ax=fx/dist,ay=fy/dist;

  const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

  /* Heading is square to the line between the fingers. */
  const hd={x:-ay,y:ax};

  /* Head length = the gap, minus room under each fingertip. */
  const sp=RAKE.spacing;
  const span=Math.max(0,dist-2*CFG.fingerGapPx*UPP);

  RAKE.tines=clamp(
    1+2*Math.floor(span/(2*sp)),
    CFG.minTines,
    CFG.maxTines
  );

  if(rake.mode!=="two"){
    rake.mode="two";
    rakeStroke=newStroke(RAKE,mid,"rake");
  }

  rake.placed=true;
  rake.on=true;
  rake.pull=false;

  rake.hx=mid.x;
  rake.hy=mid.y;
  rake.dx=hd.x;
  rake.dy=hd.y;
  rake.f1=a;
  rake.f2=b;

  strokeMove(rakeStroke,mid,hd);
}

function updateRake(fs){

  /* Fully visible in hand, softer while it rests on the sand. */
  const target=rake.on?1:(rake.placed?.5:0);

  rake.vis+=(target-rake.vis)*(1-Math.exp(-.12*fs));
}


/* =========================================================
   POINTER START
========================================================= */

function down(e){

  e.preventDefault();

  try{canvas.setPointerCapture(e.pointerId);}
  catch(_){}

  const p=pointerPoint(e);

  pointers.set(e.pointerId,p);

  if(firstInteraction){
    firstInteraction=false;
    hint.classList.remove("show");
  }

  /* A second finger: the head is placed between the pair. */
  if(pointers.size>=2){

    clearTimeout(longPressTimer);

    tap=null;

    /* A dragged stone keeps its finger; extras are ignored. */
    if(activeStone)return;

    smoothing=false;
    smoothCur=null;

    const pts=[...pointers.values()];

    rake.mode=null;

    rakeTwo(pts[0],pts[1]);

    return;
  }

  tap={
    id:e.pointerId,
    x:p.x,y:p.y,
    t:performance.now(),
    moved:false
  };

  const stone=nearestStone(p.x,p.y);

  if(stone){

    activeStone=stone;
    activePointer=e.pointerId;

    stone.dragDX=p.x-stone.x;
    stone.dragDY=p.y-stone.y;

    stoneStroke=newStroke(
      {turn:18},
      {x:stone.x,y:stone.y},
      "wake"
    );

    stoneStroke.stone=stone;

    rake.on=false;

    tap=null;
    return;
  }

  disturbPetalsAt(p.x,p.y,18);

  rakeGrab(p);

  lastSmooth={x:rake.hx,y:rake.hy};

  /*
    Long press = smoothing, but ONLY if the finger
    has stayed put. Moving cancels it (see handleMove).
    Smoothing works at the head position, in plain view.
  */
  clearTimeout(longPressTimer);

  longPressTimer=setTimeout(()=>{

    if(
      pointers.size===1&&
      tap&&!tap.moved
    ){

      const h={x:rake.gx+rake.ox,y:rake.gy+rake.oy};

      smoothing=true;
      rake.on=false;
      rake.mode=null;
      rakeStroke=null;

      rake.hx=h.x;
      rake.hy=h.y;

      lastSmooth=h;
      smoothCur=h;

      smoothAt(h.x,h.y);
    }

  },620);
}


/* =========================================================
   POINTER MOVE
========================================================= */

function handleMove(id,p){

  if(
    tap&&tap.id===id&&!tap.moved&&
    Math.hypot(p.x-tap.x,p.y-tap.y)>8
  ){
    tap.moved=true;
    clearTimeout(longPressTimer);
  }

  /* Stone drag. Other fingers are ignored meanwhile. */
  if(activeStone){

    if(id!==activePointer)return;

    activeStone.x=clamp(p.x-activeStone.dragDX,0,W);
    activeStone.y=clamp(p.y-activeStone.dragDY,0,H);

    strokeMove(stoneStroke,{
      x:activeStone.x,
      y:activeStone.y
    });

    return;
  }

  /* Two fingers: the rake works between them. */
  if(pointers.size>=2){

    const pts=[...pointers.values()];

    rakeTwo(pts[0],pts[1]);

    return;
  }

  if(smoothing){

    const h={x:p.x+rake.ox,y:p.y+rake.oy};

    rake.gx=p.x;
    rake.gy=p.y;
    rake.hx=h.x;
    rake.hy=h.y;

    smoothCur=h;
    smoothTo(h);

    return;
  }

  if(rake.mode!=="one")rakeGrab(p);

  rakeHold(p);
}

function move(e){

  if(!pointers.has(e.pointerId))return;

  e.preventDefault();

  const evs=
    (e.getCoalescedEvents&&e.getCoalescedEvents())||[];

  if(!evs.length)evs.push(e);

  for(const ev of evs){

    const p=pointerPoint(ev);

    pointers.set(e.pointerId,p);

    handleMove(e.pointerId,p);
  }
}


/* =========================================================
   POINTER END
========================================================= */

function up(e){

  if(!pointers.has(e.pointerId))return;

  const p=pointers.get(e.pointerId);

  const idx=[...pointers.keys()].indexOf(e.pointerId);

  const wasTap=
    tap&&tap.id===e.pointerId&&
    !tap.moved&&!smoothing&&
    e.type!=="pointercancel"&&
    performance.now()-tap.t<500;

  pointers.delete(e.pointerId);

  clearTimeout(longPressTimer);

  if(activeStone&&activePointer===e.pointerId){

    stoneRings(activeStone);

    activeStone=null;
    activePointer=null;
    stoneStroke=null;

  }else if(wasTap){

    ripple(p.x,p.y);
  }

  if(tap&&tap.id===e.pointerId)tap=null;

  smoothing=false;
  smoothCur=null;

  if(pointers.size===0){

    /* Let go: the rake stays exactly where it is. */
    rake.on=false;
    rake.mode=null;
    rakeStroke=null;

  }else if(idx<2){

    rake.mode=null;

    if(pointers.size===1&&!activeStone){

      /* The remaining finger keeps the handle at its current distance. */
      rakeGrab([...pointers.values()][0]);
    }
  }
}


/* =========================================================
   RENDER
========================================================= */

function rgb(c){
  return "rgb("+
    (c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
}

function rgba(c,a){
  return "rgba("+
    (c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+","+a+")";
}

/* The rake itself: handle, head bar and a dot per tine. */
function drawRake(){

  const a=rake.vis;

  if(a<=.01||!rake.placed)return;

  const L=LIGHT;
  const g=ENV.grade;
  const k=(1-.2*ENV.wet)/255;

  const wood=function(c,al){
    return "rgba("+
      ((c[0]*g[0]*k)|0)+","+
      ((c[1]*g[1]*k)|0)+","+
      ((c[2]*g[2]*k)|0)+","+al+")";
  };

  const n=RAKE.tines,sp=RAKE.spacing;
  const half=(n-1)/2*sp;
  const barHalf=half+sp*.8;

  /* Bar axis is square to the heading. */
  const px=-rake.dy,py=rake.dx;

  const hx=rake.hx,hy=rake.hy;

  const e1x=hx-px*barHalf,e1y=hy-py*barHalf;
  const e2x=hx+px*barHalf,e2y=hy+py*barHalf;

  ctx.save();
  ctx.lineCap="round";

  const off=3+4*L.shLen;
  const sox=-L.tx*off,soy=-L.ty*off;
  const sh=L.shAmt*.22*a;

  /* Handle: from your fingertip to the middle of the head. */
  if(rake.on&&rake.mode==="one"){

    if(sh>.01){
      ctx.strokeStyle="rgba(30,26,22,"+sh+")";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(rake.gx+sox,rake.gy+soy);
      ctx.lineTo(hx+sox,hy+soy);
      ctx.stroke();
    }

    ctx.strokeStyle=wood([112,86,62],a);
    ctx.lineWidth=2.6;
    ctx.beginPath();
    ctx.moveTo(rake.gx,rake.gy);
    ctx.lineTo(hx,hy);
    ctx.stroke();
  }

  /* Two fingers: faint ties from the bar ends to each fingertip. */
  if(rake.on&&rake.mode==="two"&&rake.f1&&rake.f2){

    const s1=(rake.f1.x-hx)*px+(rake.f1.y-hy)*py;

    const fa=s1<0?rake.f1:rake.f2;
    const fb=s1<0?rake.f2:rake.f1;

    ctx.strokeStyle=wood([150,120,90],a*.4);
    ctx.lineWidth=1.4;
    ctx.beginPath();
    ctx.moveTo(e1x,e1y);
    ctx.lineTo(fa.x,fa.y);
    ctx.moveTo(e2x,e2y);
    ctx.lineTo(fb.x,fb.y);
    ctx.stroke();
  }

  /* Head shadow */
  if(sh>.01){
    ctx.strokeStyle="rgba(30,26,22,"+sh+")";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(e1x+sox,e1y+soy);
    ctx.lineTo(e2x+sox,e2y+soy);
    ctx.stroke();
  }

  /* Head bar */
  ctx.strokeStyle=wood([138,106,76],a);
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(e1x,e1y);
  ctx.lineTo(e2x,e2y);
  ctx.stroke();

  /* Lit edge of the bar */
  ctx.strokeStyle=wood([190,160,125],a*.55);
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(e1x+L.tx*1.3,e1y+L.ty*1.3);
  ctx.lineTo(e2x+L.tx*1.3,e2y+L.ty*1.3);
  ctx.stroke();

  /* Tines: one dot per groove it is cutting. */
  ctx.fillStyle=wood([70,70,74],a);

  for(let i=0;i<n;i++){

    const o=(i-(n-1)/2)*sp;

    ctx.beginPath();
    ctx.arc(hx+px*o,hy+py*o,1.8,0,Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

/* Ring showing where the smoothing tool is working. */
function drawSmoothCursor(){

  if(!smoothing||!smoothCur)return;

  ctx.beginPath();
  ctx.arc(smoothCur.x,smoothCur.y,20,0,Math.PI*2);

  ctx.strokeStyle=rgba(ENV.hi,.35);
  ctx.lineWidth=1.2;
  ctx.stroke();
}

function render(){

  flushSand();

  ctx.setTransform(K,0,0,K,0,0);
  ctx.globalCompositeOperation="source-over";

  ctx.drawImage(sand,0,0);

  /*
    Ambient light: the whole garden is graded by the time of
    day, and darkens a little when the sand is wet.
  */
  const g=ENV.grade;
  const dry=1-.16*ENV.wet;

  ctx.globalCompositeOperation="multiply";
  ctx.fillStyle=rgb([g[0]*dry,g[1]*dry,g[2]*dry]);
  ctx.fillRect(0,0,W,H);

  /* Low sun glow from the side the light comes from. */
  const ga=ENV.glowAmt*(1-.6*ENV.over);

  if(ga>.01){

    const fromLeft=LIGHT.tx<0;

    const gg=ctx.createLinearGradient(
      fromLeft?0:W,0,
      fromLeft?W*.85:W*.15,0
    );

    gg.addColorStop(0,rgba(ENV.glow,ga));
    gg.addColorStop(1,rgba(ENV.glow,0));

    ctx.globalCompositeOperation="screen";
    ctx.fillStyle=gg;
    ctx.fillRect(0,0,W,H);
  }

  ctx.globalCompositeOperation="source-over";

  /*
    Ripples
  */
  for(let i=0;i<ripples.length;i++){

    const r=ripples[i];

    ctx.beginPath();
    ctx.arc(r.x,r.y,r.r,0,Math.PI*2);

    ctx.strokeStyle=rgba(ENV.hi,r.alpha);

    ctx.lineWidth=1.2;
    ctx.stroke();

    if(r.r>12){

      ctx.beginPath();
      ctx.arc(r.x,r.y,r.r-8,0,Math.PI*2);

      ctx.strokeStyle=rgba(ENV.hi,r.alpha*.20);

      ctx.stroke();
    }
  }

  /*
    Stones (the one being dragged is drawn on top)
  */
  for(const s of stones){
    if(s!==activeStone)s.draw();
  }

  if(activeStone)activeStone.draw();

  /*
    Petals cast shadows on the sand (and on stones).
  */
  for(const p of petals){
    if(!p.dead)p.drawShadow();
  }

  /*
    Petals. They are environmental, not UI.
  */
  for(const p of petals){
    if(!p.dead)p.draw();
  }

  /*
    The rake, held above everything on the sand.
  */
  drawRake();
  drawSmoothCursor();

  /*
    Rain: one batched path.
  */
  if(raindrops.length){

    ctx.beginPath();

    for(const d of raindrops){

      const len=d.vy*.55;
      const tx=d.vx/d.vy*len;

      ctx.moveTo(d.x,d.y);
      ctx.lineTo(d.x-tx,d.y-len);
    }

    ctx.strokeStyle=rgba(ENV.rainCol,.30);
    ctx.lineWidth=1;
    ctx.stroke();
  }

  /*
    Barely-there vignette.
  */
  const v=ctx.createRadialGradient(
    W/2,H/2,Math.min(W,H)*.28,
    W/2,H/2,Math.max(W,H)*.75
  );

  v.addColorStop(0,"rgba(0,0,0,0)");
  v.addColorStop(1,"rgba(25,22,18,.12)");

  ctx.fillStyle=v;
  ctx.fillRect(0,0,W,H);

  /*
    Lightning: a soft wash, not a full-white strobe.
  */
  if(ENV.flash>.02){

    ctx.globalCompositeOperation="screen";
    ctx.fillStyle=
      "rgba(235,240,255,"+(ENV.flash*.34)+")";
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation="source-over";
  }
}


/* =========================================================
   MAIN LOOP  (frame-rate independent)
========================================================= */

let lastTime=0;

function frame(ts){

  if(!lastTime)lastTime=ts;

  let dt=ts-lastTime;
  lastTime=ts;

  if(dt>100)dt=100;

  const fs=dt/16.667;

  updateEnv(dt);
  updateRain(fs);
  updatePetals(fs);
  updateRipples(fs);
  updateLightning(fs);
  updateRake(fs);

  render();

  requestAnimationFrame(frame);
}


/* =========================================================
   EVENTS
========================================================= */

canvas.addEventListener("pointerdown",down,{passive:false});
canvas.addEventListener("pointermove",move,{passive:false});
canvas.addEventListener("pointerup",up,{passive:false});
canvas.addEventListener("pointercancel",up,{passive:false});

window.addEventListener("resize",resize);


/* =========================================================
   BOOT
========================================================= */

updateEnv(0);
resize();
makePetals();   // after resize, so petals spread over the real garden size
requestAnimationFrame(frame);

setTimeout(()=>{
  if(firstInteraction)hint.classList.add("show");
},400);

setTimeout(()=>{
  hint.classList.remove("show");
},4500);

</script>
</body>
